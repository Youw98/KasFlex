<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-label="KasFlex">
  <title>KasFlex</title>
  <defs>
    <clipPath id="kf-logo-light-frame"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#kf-logo-light-frame)">
    <rect width="64" height="64" fill="#FCFAF6"/>
<circle cx="46" cy="21" r="13" fill="#F6B943"/>

    <!-- The ribbon. One continuous flowing form, not two objects. The left hill
         carries real weight so the silhouette is two lobes rather than a dome
         with a bump beside it. -->
    <path d="M-3 58C-3 44 4 31 14 31c9 0 10 12 17 12
             c8 0 6-26 16-26 11 0 20 13 20 27v24H-3Z" fill="#41864E"/>

    <!-- Glazing bars, only inside the dome. Cream at low opacity so they read as
         light on glass at large sizes and dissolve into the fill when small. -->
    <g stroke="#FCFAF6" stroke-width="1.5" stroke-linecap="round" opacity=".5">
      <path d="M47 19.5v22M54.5 24v18M40 28.5V42"/>
    </g>

    <!-- Second wave: the flowing energy passing under the landscape. Kept thick
         enough to still be a band rather than a hairline at small sizes. -->
    <path d="M-3 67V54c8-6 16.5-7.5 25-4.5 8 2.8 11.5 7.5 18.5 5 8-2.8 17-3 26.5.5V67Z"
          fill="#BDD8C1"/>
  </g>
  <text x="82" y="39" font-family="Manrope, 'Nunito Sans', -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="31" font-weight="800" letter-spacing="-0.4" fill="#FCFAF6">KasFlex</text>
  <text x="83" y="54" font-family="Manrope, 'Nunito Sans', -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="1.7" fill="#BDD8C1">GROW TODAY FOR A BRIGHTER TOMORROW</text>
</svg>
