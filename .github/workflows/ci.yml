name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly, so a newly published advisory for a dependency shows up without a push.
  schedule:
    - cron: "17 6 * * 1"

# Tests only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ workers/
      - name: Check browser JavaScript syntax
        run: node --check src/kasflex/ui/static/demo.js && node --check src/kasflex/ui/static/grower.js && node --check src/kasflex/ui/static/app.js && node --check src/kasflex/ui/static/setup.js && node --check src/kasflex/ui/static/admin.js
      - run: pytest -q --cov=kasflex --cov-report=term

  # The grid extra pulls numpy>=2 and must be installable on its own. It is NOT
  # installed alongside gl-gym anywhere -- see docs/DECISIONS.md ADR-0002.
  grid-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,grid]"
      - run: pytest -q tests/test_grid.py
      - name: Core must not import gl_gym
        run: |
          if grep -rn "import gl_gym\|from gl_gym" src/; then
            echo "::error::KasFlex core must never import gl_gym (AGPL-3.0). See ADR-0001."
            exit 1
          fi

  mcp-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mcp]"
      - name: MCP server imports and exposes tools
        run: |
          python - <<'PY'
          from kasflex.mcp_server import mcp
          assert mcp is not None
          print("MCP server import OK")
          PY

  # The AGPL worker environment, isolated. gl-gym pins numpy<2.
  greenlight-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r workers/greenlight/requirements.txt
      - name: Worker simulates a day
        run: |
          python - <<'PY'
          import json, subprocess, sys
          plan = {"intervals": [
              {"hour": h, "heat_source": "boiler", "lighting_level": 0.5,
               "battery": "idle", "battery_power_kw": 0, "chp_mode": "off",
               "co2_source": "chp", "reasoning": ""} for h in range(24)]}
          req = {"cmd": "simulate_day", "plan": plan, "floor_area_m2": 50000, "seed": 0}
          p = subprocess.run([sys.executable, "workers/greenlight/worker.py"],
                             input=json.dumps(req) + "\n", capture_output=True, text=True)
          resp = json.loads(p.stdout.strip().splitlines()[-1])
          assert resp["ok"], resp.get("error")
          heat = resp["outcome"]["heat_demand_kw"]
          assert len(heat) == 24
          w_m2 = [h * 1000 / 50000 for h in heat]
          assert max(w_m2) < 200, f"implausible heat demand: {max(w_m2):.0f} W/m2"
          lighting = resp["outcome"]["diagnostics"]["lighting_electricity_kwh"]
          # Default GreenLight lamp density is 116 W/m2. At 50% for 24 h on
          # 50,000 m2 that is 69,600 kWh. This guards against accidentally
          # dividing a W/m2 parameter by model floor area again.
          assert 69_000 < lighting < 70_200, lighting
          print(f"OK: peak heat demand {max(w_m2):.0f} W/m2")
          PY
      - name: Worker applies the AGC2 calibration and refuses unknown parameters
        run: |
          python - <<'PY'
          import json, subprocess, sys
          plan = {"intervals": [
              {"hour": h, "heat_source": "boiler", "lighting_level": 1.0 if h < 16 else 0.0,
               "battery": "idle", "battery_power_kw": 0, "chp_mode": "off",
               "co2_source": "chp", "reasoning": ""} for h in range(24)]}

          def call(extra):
              req = {"cmd": "simulate_day", "plan": plan, "floor_area_m2": 96, "seed": 0, **extra}
              p = subprocess.run([sys.executable, "workers/greenlight/worker.py"],
                                 input=json.dumps(req) + "\n", capture_output=True, text=True)
              return json.loads(p.stdout.strip().splitlines()[-1])

          cooled = call({})["outcome"]["diagnostics"]
          uncooled = call({"calibration": {"etaLampCool": 0.0}})["outcome"]["diagnostics"]
          # Keeping lamp heat inside the greenhouse must reduce the heat the boiler supplies.
          assert uncooled["heating_energy_kwh"] < cooled["heating_energy_kwh"], (cooled, uncooled)
          assert uncooled["pipe_heat_agc_formula_kwh"] >= 0
          bad = call({"calibration": {"notAParameter": 1.0}})
          assert not bad["ok"] and "unknown calibration" in bad["error"], bad
          print("OK: calibration applied", round(cooled["heating_energy_kwh"], 1), "->",
                round(uncooled["heating_energy_kwh"], 1), "kWh")
          PY

  browser:
    # The grower page in headless Chromium: a full session, a disagreement, the
    # no-advisor version, and axe-core on the main screens.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-save axe-core@4
      - run: pytest -q tests/browser -rs

  dependency-audit:
    # Known advisories in everything KasFlex installs, extras included. pip and
    # setuptools are upgraded first: they are tooling, not shipped dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev,data,llm,mcp,browser]" pip-audit
      - run: pip-audit --skip-editable

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: FAIR metadata is valid
        run: |
          python -c "import json; json.load(open('codemeta.json')); print('codemeta.json ok')"
          python -c "import yaml; d=yaml.safe_load(open('CITATION.cff')); assert d['cff-version']; print('CITATION.cff ok')"
